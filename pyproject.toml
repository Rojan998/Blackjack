[project]
name = "blackjack"
version = "0.1.0"
description = "Console Blackjack Game"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.162.5",
    "pydantic>=2.14.3",
]

[project.scripts]
blackjack = "blackjack:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
